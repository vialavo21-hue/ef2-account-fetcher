<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EF2 Account Data Viewer</title>
<style>
  :root{
    --bg:#15111c; --panel:#1e1828; --panel-2:#241d33; --border:rgba(200,180,220,.18);
    --text:#e6d8f0; --text-dim:#9a8aae; --accent:#c8a0f0; --accent-2:#7a3aca;
    --good:#7fe6a0; --bad:#e08a8a; --gold:#ffcf7a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,system-ui,sans-serif;font-size:13px}
  header{position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--border);padding:12px 18px}
  h1{margin:0 0 8px;font-size:16px;color:var(--gold)}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .dropzone{flex:1;min-width:220px;border:1.5px dashed var(--border);border-radius:8px;padding:10px 14px;text-align:center;color:var(--text-dim);cursor:pointer;transition:border-color .15s,background .15s}
  .dropzone.drag{border-color:var(--accent);background:rgba(200,160,240,.06)}
  .meta{color:var(--text-dim);font-size:12px}
  .meta b{color:var(--text)}
  input[type=file]{display:none}
  nav{display:flex;gap:6px;padding:10px 18px 0}
  nav button{padding:7px 14px;border:1px solid var(--border);border-radius:7px 7px 0 0;background:var(--panel-2);color:var(--text-dim);font:inherit;font-weight:600;cursor:pointer}
  nav button.active{background:var(--accent-2);color:#fff;border-color:var(--accent-2)}
  main{padding:16px 18px 40px}
  section{display:none}
  section.active{display:block}
  .empty{color:var(--text-dim);font-style:italic;padding:30px 0;text-align:center}
  .controls{display:flex;gap:10px;align-items:center;margin-bottom:10px}
  .controls input[type=search]{flex:1;max-width:280px;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--panel-2);color:var(--text);font:inherit}
  .controls label{display:flex;align-items:center;gap:5px;color:var(--text-dim);font-size:12px}
  table{width:100%;border-collapse:collapse;background:var(--panel);border-radius:8px;overflow:hidden}
  thead th{position:sticky;top:0;background:var(--panel-2);text-align:left;padding:8px 10px;font-size:11.5px;color:var(--accent);cursor:pointer;user-select:none;white-space:nowrap;border-bottom:1px solid var(--border)}
  thead th:hover{color:var(--gold)}
  thead th.sorted::after{content:" ▾";font-size:9px}
  thead th.sorted.asc::after{content:" ▴"}
  tbody td{padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.05);white-space:nowrap}
  tbody tr:hover{background:rgba(255,255,255,.03)}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:10.5px;font-weight:700}
  .tag.yes{background:rgba(127,230,160,.15);color:var(--good)}
  .tag.no{background:rgba(255,255,255,.06);color:var(--text-dim)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
  .card.active{border-color:var(--accent)}
  .card-title{display:flex;justify-content:space-between;align-items:center;font-weight:700;color:var(--gold);margin-bottom:6px}
  .card-title .active-badge{font-size:10px;padding:1px 6px;border-radius:8px;background:var(--accent-2);color:#fff}
  .member-row{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px dashed rgba(255,255,255,.06);font-size:12px}
  .member-row:last-child{border-bottom:none}
  .member-name{color:var(--text)}
  .member-stats{color:var(--text-dim);font-variant-numeric:tabular-nums}
  .subheading{font-size:13px;font-weight:700;color:var(--accent);margin:18px 0 8px}
  .subheading:first-child{margin-top:0}
  footer{padding:10px 18px 30px;color:var(--text-dim);font-size:11px;text-align:center}
</style>
</head>
<body>

<header>
  <h1>EF2 Account Data Viewer</h1>
  <div class="toolbar">
    <div class="dropzone" id="dropzone">Drop an exported <code>.json</code> file here, or click to choose one</div>
    <input type="file" id="fileInput" accept="application/json,.json">
    <div class="meta" id="meta">No file loaded yet</div>
  </div>
</header>

<nav id="tabs">
  <button data-tab="heroes" class="active">Heroes</button>
  <button data-tab="relics">Relics</button>
  <button data-tab="presets">Presets</button>
  <button data-tab="pets">Pets</button>
</nav>

<main>
  <section id="tab-heroes" class="active">
    <div class="controls">
      <input type="search" id="heroSearch" placeholder="Search heroes…">
      <label><input type="checkbox" id="heroOwnedOnly" checked> owned only</label>
    </div>
    <div id="heroTableWrap"></div>
  </section>

  <section id="tab-relics">
    <div class="controls">
      <input type="search" id="relicSearch" placeholder="Search relics…">
    </div>
    <div id="relicTableWrap"></div>
  </section>

  <section id="tab-presets">
    <div class="subheading">Hero Presets</div>
    <div class="grid" id="heroPresetGrid"></div>
    <div class="subheading">Relic Presets</div>
    <div class="grid" id="relicPresetGrid"></div>
  </section>

  <section id="tab-pets">
    <div class="controls">
      <input type="search" id="petSearch" placeholder="Search pets…">
    </div>
    <div id="petTableWrap"></div>
  </section>
</main>

<footer>Everything here runs entirely in your browser — the loaded file is never uploaded anywhere.</footer>

<script>
(function () {
  "use strict";

  var data = null;
  var sortState = {}; // per-table { key, dir }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function tag(bool) { return '<span class="tag ' + (bool ? "yes" : "no") + '">' + (bool ? "yes" : "no") + "</span>"; }

  // ---- generic sortable table renderer ------------------------------------------------------
  function renderTable(container, tableId, columns, rows) {
    var state = sortState[tableId] || { key: columns[0].key, dir: 1 };
    sortState[tableId] = state;

    var sorted = rows.slice().sort(function (a, b) {
      var va = a[state.key], vb = b[state.key];
      if (typeof va === "string" || typeof vb === "string") {
        va = String(va == null ? "" : va).toLowerCase();
        vb = String(vb == null ? "" : vb).toLowerCase();
        return va < vb ? -state.dir : va > vb ? state.dir : 0;
      }
      va = Number(va) || 0; vb = Number(vb) || 0;
      return (va - vb) * state.dir;
    });

    var html = '<table><thead><tr>' + columns.map(function (c) {
      var cls = c.key === state.key ? "sorted" + (state.dir === -1 ? " asc" : "") : "";
      return '<th class="' + cls + '" data-key="' + c.key + '">' + esc(c.label) + "</th>";
    }).join("") + "</tr></thead><tbody>";

    if (sorted.length === 0) {
      html += '<tr><td colspan="' + columns.length + '"><div class="empty">(no rows)</div></td></tr>';
    } else {
      sorted.forEach(function (row) {
        html += "<tr>" + columns.map(function (c) {
          var v = c.render ? c.render(row) : esc(row[c.key]);
          return '<td class="' + (c.num ? "num" : "") + '">' + v + "</td>";
        }).join("") + "</tr>";
      });
    }
    html += "</tbody></table>";
    container.innerHTML = html;

    container.querySelectorAll("th").forEach(function (th) {
      th.addEventListener("click", function () {
        var key = th.getAttribute("data-key");
        if (state.key === key) { state.dir *= -1; } else { state.key = key; state.dir = 1; }
        renderTable(container, tableId, columns, rows);
      });
    });
  }

  // ---- Heroes --------------------------------------------------------------------------------
  var heroColumns = [
    { key: "name", label: "Name" },
    { key: "kindNum", label: "#", num: true },
    { key: "tribe", label: "Tribe", num: true },
    { key: "grade", label: "Grade", num: true },
    { key: "trans", label: "Trans", num: true },
    { key: "transCountsStr", label: "Trans Counts" },
    { key: "level", label: "Level", num: true, render: function (r) { return r.level == null ? "" : r.level; } },
    { key: "enhance", label: "Enhance", num: true, render: function (r) { return r.enhance == null ? "" : r.enhance; } },
    { key: "owned", label: "Owned", render: function (r) { return tag(r.owned); } },
    { key: "deployed", label: "Deployed", render: function (r) { return tag(r.deployed); } }
  ];
  function renderHeroes() {
    var wrap = document.getElementById("heroTableWrap");
    var search = document.getElementById("heroSearch").value.trim().toLowerCase();
    var ownedOnly = document.getElementById("heroOwnedOnly").checked;
    var rows = (data && data.heroes ? data.heroes : []).map(function (h) {
      return Object.assign({}, h, { transCountsStr: (h.transCounts || []).join(" / ") });
    }).filter(function (h) {
      if (ownedOnly && !h.owned) { return false; }
      if (search && String(h.name).toLowerCase().indexOf(search) === -1 && String(h.kindNum).indexOf(search) === -1) { return false; }
      return true;
    });
    renderTable(wrap, "heroes", heroColumns, rows);
  }

  // ---- Relics ----------------------------------------------------------------------------------
  var relicColumns = [
    { key: "name", label: "Name" },
    { key: "kindNum", label: "#", num: true },
    { key: "grade", label: "Grade", num: true },
    { key: "trans", label: "Trans", num: true },
    { key: "limitBreak", label: "Limit Break", num: true },
    { key: "enhance", label: "Enhance", num: true },
    { key: "equipped", label: "Equipped", render: function (r) { return tag(r.equipped); } }
  ];
  function renderRelics() {
    var wrap = document.getElementById("relicTableWrap");
    var search = document.getElementById("relicSearch").value.trim().toLowerCase();
    var rows = (data && data.relics ? data.relics : []).filter(function (r) {
      if (!search) { return true; }
      return String(r.name).toLowerCase().indexOf(search) !== -1 || String(r.kindNum).indexOf(search) !== -1;
    });
    renderTable(wrap, "relics", relicColumns, rows);
  }

  // ---- Pets ------------------------------------------------------------------------------------
  var petColumns = [
    { key: "name", label: "Name" },
    { key: "kindNum", label: "#", num: true },
    { key: "grade", label: "Grade", num: true },
    { key: "fragments", label: "Fragments", num: true },
    { key: "represented", label: "Represent", render: function (r) { return tag(r.represented); } },
    { key: "revive", label: "Revive", render: function (r) { return tag(r.revive); } }
  ];
  function renderPets() {
    var wrap = document.getElementById("petTableWrap");
    var search = document.getElementById("petSearch").value.trim().toLowerCase();
    var rows = (data && data.pets ? data.pets : []).filter(function (p) {
      if (!search) { return true; }
      return String(p.name).toLowerCase().indexOf(search) !== -1 || String(p.kindNum).indexOf(search) !== -1;
    });
    renderTable(wrap, "pets", petColumns, rows);
  }

  // ---- Presets (card grid, not tables) -----------------------------------------------------------
  function renderHeroPresets() {
    var grid = document.getElementById("heroPresetGrid");
    var presets = (data && data.presets && data.presets.hero) ? data.presets.hero : [];
    if (presets.length === 0) { grid.innerHTML = '<div class="empty">(no hero preset data in this export)</div>'; return; }
    grid.innerHTML = presets.map(function (preset) {
      var members = preset.team && preset.team.length
        ? preset.team.map(function (m) {
            return '<div class="member-row"><span class="member-name">' + esc(m.name) + '</span>'
              + '<span class="member-stats">trans ' + m.trans + " · enh " + m.enhance + "</span></div>";
          }).join("")
        : '<div class="empty">(empty slot)</div>';
      return '<div class="card' + (preset.active ? " active" : "") + '">'
        + '<div class="card-title"><span>Slot ' + (preset.slotId + 1) + (preset.label ? " — " + esc(preset.label) : "") + '</span>'
        + (preset.active ? '<span class="active-badge">ACTIVE</span>' : "") + "</div>"
        + members + "</div>";
    }).join("");
  }
  function renderRelicPresets() {
    var grid = document.getElementById("relicPresetGrid");
    var presets = (data && data.presets && data.presets.relic) ? data.presets.relic : [];
    if (presets.length === 0) { grid.innerHTML = '<div class="empty">(no relic preset data in this export)</div>'; return; }
    grid.innerHTML = presets.map(function (preset) {
      var relics = preset.relics && preset.relics.length
        ? preset.relics.map(function (r) {
            var cur = r.current ? ("trans " + r.current.trans + " · lb " + r.current.limitBreak + " · enh " + r.current.enhance) : "current stats unknown";
            return '<div class="member-row"><span class="member-name">' + esc(r.name) + '</span>'
              + '<span class="member-stats">' + esc(cur) + "</span></div>";
          }).join("")
        : '<div class="empty">(empty slot)</div>';
      return '<div class="card' + (preset.active ? " active" : "") + '">'
        + '<div class="card-title"><span>Slot ' + (preset.slotId + 1) + (preset.label ? " — " + esc(preset.label) : "") + '</span>'
        + (preset.active ? '<span class="active-badge">ACTIVE</span>' : "") + "</div>"
        + relics + "</div>";
    }).join("");
  }

  function renderAll() {
    renderHeroes();
    renderRelics();
    renderHeroPresets();
    renderRelicPresets();
    renderPets();
  }

  // ---- tabs ------------------------------------------------------------------------------------
  document.getElementById("tabs").addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-tab]");
    if (!btn) { return; }
    document.querySelectorAll("#tabs button").forEach(function (b) { b.classList.toggle("active", b === btn); });
    document.querySelectorAll("main section").forEach(function (s) { s.classList.toggle("active", s.id === "tab-" + btn.getAttribute("data-tab")); });
  });

  // ---- file loading (drag/drop + click) ---------------------------------------------------------
  var dropzone = document.getElementById("dropzone");
  var fileInput = document.getElementById("fileInput");
  var meta = document.getElementById("meta");

  function loadFile(file) {
    if (!file) { return; }
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var parsed = JSON.parse(reader.result);
        data = parsed;
        var takenAt = parsed.takenAt ? new Date(parsed.takenAt).toLocaleString() : "unknown";
        meta.innerHTML = "Loaded <b>" + esc(file.name) + "</b> — captured <b>" + esc(takenAt) + "</b>"
          + " — " + (parsed.heroes ? parsed.heroes.length : 0) + " heroes, "
          + (parsed.relics ? parsed.relics.length : 0) + " relics, "
          + (parsed.pets ? parsed.pets.length : 0) + " pets";
        renderAll();
      } catch (err) {
        meta.textContent = "Failed to parse " + file.name + ": " + err.message;
      }
    };
    reader.readAsText(file);
  }

  dropzone.addEventListener("click", function () { fileInput.click(); });
  fileInput.addEventListener("change", function () { loadFile(fileInput.files[0]); });
  ["dragenter", "dragover"].forEach(function (evt) {
    dropzone.addEventListener(evt, function (e) { e.preventDefault(); dropzone.classList.add("drag"); });
  });
  ["dragleave", "drop"].forEach(function (evt) {
    dropzone.addEventListener(evt, function (e) { e.preventDefault(); dropzone.classList.remove("drag"); });
  });
  dropzone.addEventListener("drop", function (e) {
    var file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    loadFile(file);
  });

  ["heroSearch", "heroOwnedOnly"].forEach(function (id) { document.getElementById(id).addEventListener("input", renderHeroes); });
  document.getElementById("heroOwnedOnly").addEventListener("change", renderHeroes);
  document.getElementById("relicSearch").addEventListener("input", renderRelics);
  document.getElementById("petSearch").addEventListener("input", renderPets);

  renderAll();
})();
</script>

</body>
</html>
